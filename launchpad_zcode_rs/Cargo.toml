[package]
name = "launchpad_zcode_rs"
version = "0.1.0"
edition = "2021"
authors = ["Máté Róbert"]
description = "High performance Novation Launchpad Mini MK3 controller and Zcode AI notification daemon written in Rust"

[dependencies]
midir = "0.9"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
clap = { version = "4.4", features = ["derive"] }

[[bin]]
name = "zcode-launchpad-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "zcode-launchpad-notify"
path = "src/bin/notify.rs"
