[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zcode-launchpad"
version = "0.1.0"
description = "Novation Launchpad Mini MK3 integration for Zcode AI coding app"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mido>=1.2.10",
    "python-rtmidi>=1.4.9"
]

[project.scripts]
zcode-launchpad-daemon = "launchpad_zcode.daemon:main"
zcode-launchpad-notify = "launchpad_zcode.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
